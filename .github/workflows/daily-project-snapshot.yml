name: Daily project snapshot
on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:

concurrency:
  group: daily-project-snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the latest main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Sync before generating the snapshot
        run: git pull --rebase origin main

      - name: Update project metrics
        run: node scripts/update-projects.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate site data and internal links
        run: |
          node --test tests/*.test.mjs
          node scripts/check-site.mjs

      - name: Commit a changed snapshot
        id: snapshot_change
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$(git status --porcelain -- dist/data/projects.json dist/data/timeline.json dist/data/history dist/index.html dist/projects)" ]]; then
            echo "No metric changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "ipunk-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dist/data/projects.json dist/data/timeline.json dist/data/history dist/index.html dist/projects
          git commit -m "data: update daily project snapshot"

          if ! git push origin HEAD:main; then
            echo "Remote main changed during the run; rebasing once before retrying"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Check existing Cloudflare deployment credentials
        id: cloudflare_auth
        if: steps.snapshot_change.outputs.changed == 'true'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=AI Worker not deployed::Existing Cloudflare credentials are missing in this repository; the changed snapshot remains committed for manual deployment."
          fi

      - name: Deploy changed snapshot to existing AI Worker
        if: steps.cloudflare_auth.outputs.available == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc

      - name: Verify published snapshot on custom domain
        if: steps.cloudflare_auth.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --ipv4 --fail --silent --show-error --location --retry 2 --retry-delay 2 --max-time 20 \
            https://ai.ipunk.cn/data/projects.json -o /tmp/ipunk-ai-live-projects.json
          cmp dist/data/projects.json /tmp/ipunk-ai-live-projects.json
