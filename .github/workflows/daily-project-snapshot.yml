name: Daily project snapshot
on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:

concurrency:
  group: daily-project-snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the latest main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Sync before generating the snapshot
        run: git pull --rebase origin main

      - name: Update project metrics
        run: node scripts/update-projects.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate site data and internal links
        run: |
          node --test tests/*.test.mjs
          node scripts/check-site.mjs

      - name: Commit a changed snapshot
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$(git status --porcelain -- dist/data/projects.json dist/data/timeline.json dist/data/history dist/index.html dist/projects)" ]]; then
            echo "No metric changes"
            exit 0
          fi

          git config user.name "ipunk-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dist/data/projects.json dist/data/timeline.json dist/data/history dist/index.html dist/projects
          git commit -m "data: update daily project snapshot"

          if ! git push origin HEAD:main; then
            echo "Remote main changed during the run; rebasing once before retrying"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
